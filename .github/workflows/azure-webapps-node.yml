name: Provision Azure Storage

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    # Preserve the existing GitHub-hosted runner.
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          # Repository secret containing Azure service-principal credentials as JSON.
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Ensure Terraform state container exists
        run: |
          az storage container create \
            --account-name aksdevstg0012504 \
            --name tfstate \
            --auth-mode login

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate Terraform
        run: terraform validate

      - name: Plan storage account changes
        run: terraform plan -input=false -out=tfplan

      - name: Create or update storage account
        run: terraform apply -input=false -auto-approve tfplan
